name: music_player
description: A local music player app with FM Radio
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  audioplayers: ^6.0.0
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.1.2
  http: ^1.2.0
  just_audio: ^0.9.37
  # flutter_audio_query REMOVED - null safety issue

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
