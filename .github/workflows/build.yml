name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: 🔧 Fix Android Configuration & Suppress SDK Errors
        run: |
          echo "🔧 Forcing compileSdkVersion to 34..."
          sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' android/app/build.gradle.kts || true
          
          echo "🔧 Forcing Kotlin version to 1.9.0..."
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" build.gradle || true
          
          echo "🔧 Adding suppression properties to gradle.properties..."
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          
          echo "✅ Config check:"
          grep -n "compileSdkVersion" android/app/build.gradle
          grep -n "kotlin_version" android/build.gradle
      
      - name: Clean Build Cache
        run: |
          flutter clean
          cd android && ./gradlew clean || true
          
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Build Release APK
        run: |
          echo "🚀 Building APK..."
          flutter build apk --release --verbose || {
            echo "❌ Build failed!"
            exit 1
          }
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
