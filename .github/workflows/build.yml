name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=music
          flutter clean
      
      - name: Fix Android SDK & Desugaring
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }" >> android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts
          fi

      - name: Add subprojects override
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          defaultConfig {
                              minSdkVersion 24
                              targetSdkVersion 36
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: |
          flutter pub get
      
      - name: Build APK using Gradle with Version
        run: |
          # Set version in app/build.gradle
          BUILD_NUMBER=${{ github.run_number }}
          echo "Build Number: $BUILD_NUMBER"
          
          # Update version in app/build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/versionName .*/versionName "1.0.'$BUILD_NUMBER'"/' android/app/build.gradle
            sed -i 's/versionCode .*/versionCode '$BUILD_NUMBER'/' android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/versionName .*/versionName = "1.0.'$BUILD_NUMBER'"/' android/app/build.gradle.kts
            sed -i 's/versionCode .*/versionCode = '$BUILD_NUMBER'/' android/app/build.gradle.kts
          fi
          
          # Build with Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          
          # Copy APK with version name
          mkdir -p build/app/outputs/flutter-apk/
          cp android/app/build/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/MusicApp-Build-${{ github.run_number }}.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/MusicApp-Build-${{ github.run_number }}.apk
