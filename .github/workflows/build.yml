name: Build Music Player APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Android SDK to 36 AND Force All Plugins
        run: |
          # 1. App build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion 21/minSdkVersion 24/g' android/app/build.gradle
          fi

          # 2. Root build.gradle - Force ALL plugins to use API 36
          cat >> android/build.gradle << 'INNER_EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          defaultConfig {
                              minSdkVersion 24
                              targetSdkVersion 36
                          }
                      }
                  }
              }
          }
          INNER_EOF

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bhai-Bhai-Music-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
