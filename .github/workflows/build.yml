name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=music
          flutter clean
      
      - name: Fix Android SDK & Desugaring
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }" >> android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts
          fi

      - name: Add root build.gradle with subprojects override
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          defaultConfig {
                              minSdkVersion 24
                              targetSdkVersion 36
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: |
          flutter pub get
      
      - name: Force Plugins to SDK 36
        run: |
          find ~/.pub-cache -name "build.gradle" -path "*/file_picker*" 2>/dev/null | while read -r file; do
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$file"
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' "$file"
            echo "✅ Fixed file_picker"
          done
          find ~/.pub-cache -name "build.gradle" -path "*/audioplayers_android*" 2>/dev/null | while read -r file; do
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$file"
            echo "✅ Fixed audioplayers_android"
          done
          find ~/.pub-cache -name "build.gradle" -path "*/flutter_plugin_android_lifecycle*" 2>/dev/null | while read -r file; do
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$file"
            echo "✅ Fixed flutter_plugin_android_lifecycle"
          done

      - name: Build Dynamic APK
        run: |
          flutter build apk --debug --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/MusicApp-Build-${{ github.run_number }}.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/MusicApp-Build-${{ github.run_number }}.apk
