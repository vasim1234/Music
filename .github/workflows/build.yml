name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      # ✅ STEP 1: Get dependencies first
      - name: Get Dependencies
        run: flutter pub get
      
      # ✅ STEP 2: 🔧 Force SDK 34 in ALL packages
      - name: 🔧 Fix ALL packages to use SDK 34
        run: |
          echo "🔧 Force fixing ALL packages to use compileSdkVersion 34..."
          
          # Find ALL build.gradle files in pub cache
          find ~/.pub-cache -name "build.gradle" -type f | while read file; do
            # Replace ALL occurrences of compileSdkVersion 35 with 34
            sed -i 's/compileSdkVersion = 35/compileSdkVersion = 34/g' "$file"
            sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' "$file"
            sed -i 's/compileSdkVersion=35/compileSdkVersion=34/g' "$file"
            sed -i 's/compileSdkVersion: 35/compileSdkVersion: 34/g' "$file"
            
            # Replace minSdkVersion if needed
            sed -i 's/minSdkVersion 21/minSdkVersion 26/g' "$file"
            sed -i 's/minSdkVersion = 21/minSdkVersion = 26/g' "$file"
          done
          
          echo "✅ ALL packages fixed to use SDK 34!"
      
      # ✅ STEP 3: Fix project files too
      - name: 🔧 Fix project files
        run: |
          # Fix app/build.gradle
          cat > android/app/build.gradle << 'EOF'
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
          }
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }
          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
          android {
              compileSdkVersion 34
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }
              defaultConfig {
                  applicationId 'com.yourcompany.yourapp'
                  minSdkVersion 26
                  targetSdkVersion 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          flutter {
              source '../..'
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
          }
          EOF
          
          # Fix root build.gradle
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          echo "✅ Project files fixed!"
      
      # ✅ STEP 4: Verify fixes
      - name: 🔍 Verify fixes
        run: |
          echo "📋 Checking if any compileSdkVersion 35 remains..."
          if grep -r "compileSdkVersion 35" ~/.pub-cache --include="build.gradle" 2>/dev/null; then
            echo "⚠️ Some files still have 35. Fixing again..."
            find ~/.pub-cache -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' {} \;
          else
            echo "✅ No compileSdkVersion 35 found in pub cache!"
          fi
          
          echo ""
          echo "📋 Project compileSdkVersion:"
          grep "compileSdkVersion" android/app/build.gradle
      
      - name: Clean Build Cache
        run: |
          flutter clean
          rm -rf android/.gradle
      
      - name: Build Release APK
        run: |
          echo "🚀 Building APK..."
          flutter build apk --release --verbose
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
