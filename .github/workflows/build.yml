name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Recreate Android Project & Fix SDK 37
      run: |
        sed -i 's/3.13.1/3.0.0/g' pubspec.yaml || true
        rm -rf android ios
        flutter create --platforms=android --project-name=music_player .
        
        # Set compileSdk to 37 explicitly
        sed -i 's/compileSdk = .*/compileSdk = 37/' android/app/build.gradle.kts || true
        sed -i 's/compileSdkVersion .*/compileSdkVersion 37/' android/app/build.gradle || true
        sed -i 's/targetSdk = .*/targetSdk = 34/' android/app/build.gradle.kts || true
        sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle || true

    - name: Add Packages
      run: |
        flutter pub add audioplayers file_picker permission_handler shared_preferences
        flutter pub get

    - name: Create Equalizer Screen
      run: |
        mkdir -p lib/screens
        cat > lib/screens/equalizer_screen.dart << 'EOF'
        import 'package:flutter/material.dart';

        class EqualizerScreen extends StatefulWidget {
          const EqualizerScreen({super.key});

          @override
          State<EqualizerScreen> createState() => _EqualizerScreenState();
        }

        class _EqualizerScreenState extends State<EqualizerScreen> {
          final List<double> _bands = List.filled(10, 0.0);

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('Equalizer'),
                backgroundColor: Colors.deepPurple,
              ),
              body: Padding(
                padding: const EdgeInsets.all(20),
                child: Column(
                  children: [
                    const Text('10 Band Equalizer', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 20),
                    Expanded(
                      child: ListView.builder(
                        itemCount: 10,
                        itemBuilder: (context, i) {
                          return Row(
                            children: [
                              SizedBox(width: 40, child: Text('${i * 60}Hz', style: const TextStyle(fontSize: 12))),
                              Expanded(
                                child: Slider(
                                  value: _bands[i],
                                  min: -10,
                                  max: 10,
                                  divisions: 20,
                                  onChanged: (v) => setState(() => _bands[i] = v),
                                ),
                              ),
                              SizedBox(width: 40, child: Text('${_bands[i].round()}dB', style: const TextStyle(fontSize: 12))),
                            ],
                          );
                        },
                      ),
                    ),
                    const SizedBox(height: 20),
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                      children: [
                        FilledButton.icon(
                          onPressed: () => setState(() => _bands.fillRange(0, _bands.length, 0.0)),
                          icon: const Icon(Icons.refresh),
                          label: const Text('Reset'),
                        ),
                        FilledButton.icon(
                          onPressed: () => Navigator.pop(context),
                          icon: const Icon(Icons.check),
                          label: const Text('Apply'),
                        ),
                      ],
                    ),
                  ],
                ),
              ),
            );
          }
        }
        EOF

    - name: Create Home Screen
      run: |
        cat > lib/screens/home_screen.dart << 'HOME_EOF'
        import 'dart:async';
        import 'dart:io';
        import 'package:audioplayers/audioplayers.dart';
        import 'package:file_picker/file_picker.dart';
        import 'package:flutter/material.dart';
        import 'package:permission_handler/permission_handler.dart';
        import 'package:shared_preferences/shared_preferences.dart';
        import 'equalizer_screen.dart';

        class HomeScreen extends StatefulWidget {
          const HomeScreen({super.key});
          @override
          State<HomeScreen> createState() => _HomeScreenState();
        }

        class _HomeScreenState extends State<HomeScreen> {
          final AudioPlayer _player = AudioPlayer();
          final TextEditingController _search = TextEditingController();
          final List<Map<String, dynamic>> _folders = [];
          final List<File> _songs = [];
          List<File> _visibleSongs = [];
          List<String> _favorites = [];
          List<String> _recent = [];
          List<Map<String, dynamic>> _playlists = [];
          String _view = 'Songs';
          String? _playlistDetail;
          int _currentIndex = -1;
          bool _playing = false;
          Duration _duration = Duration.zero;
          Duration _position = Duration.zero;
          StreamSubscription? _stateSub, _durationSub, _positionSub, _completeSub;

          @override
          void initState() {
            super.initState();
            _stateSub = _player.onPlayerStateChanged.listen((s) {
              if (!mounted) return;
              setState(() => _playing = s == PlayerState.playing);
            });
            _durationSub = _player.onDurationChanged.listen((d) {
              if (mounted) setState(() => _duration = d);
            });
            _positionSub = _player.onPositionChanged.listen((p) {
              if (mounted) setState(() => _position = p);
            });
            _completeSub = _player.onPlayerComplete.listen((_) => _next());
            _load();
          }

          Future<void> _load() async {
            final p = await SharedPreferences.getInstance();
            final folders = p.getStringList('folders') ?? [];
            _favorites = p.getStringList('favorites') ?? [];
            _recent = p.getStringList('recent') ?? [];
            final playlistStrings = p.getStringList('playlists') ?? [];
            _playlists = [];
            for (final item in playlistStrings) {
              final parts = item.split('|||');
              if (parts.isEmpty) continue;
              _playlists.add({
                'name': parts.first,
                'songs': parts.length > 1 ? parts[1].split('|').where((e) => e.isNotEmpty).toList() : <String>[],
              });
            }
            _folders..clear()..addAll(folders.map((path) => ({
              'name': path.split('/').last,
              'path': path,
              'enabled': true,
            })));
            await _scan();
            if (mounted) setState(() {});
          }

          Future<void> _save() async {
            final p = await SharedPreferences.getInstance();
            await p.setStringList('folders', _folders.map((e) => e['path'] as String).toList());
            await p.setStringList('favorites', _favorites);
            await p.setStringList('recent', _recent);
            await p.setStringList('playlists', _playlists.map((e) => '${e['name']}|||${(e['songs'] as List<String>).join('|')}').toList());
          }

          Future<void> _requestStorage() async {
            if (!Platform.isAndroid) return;
            try {
              await Permission.audio.request();
              await Permission.storage.request();
            } catch (_) {}
            await _scan();
          }

          Future<void> _scan() async {
            final result = <File>[];
            for (final folder in _folders.where((e) => e['enabled'] == true)) {
              final dir = Directory(folder['path'] as String);
              if (!await dir.exists()) continue;
              try {
                await for (final entity in dir.list(recursive: true, followLinks: false)) {
                  if (entity is File && _isAudio(entity.path)) result.add(entity);
                }
              } catch (_) {}
            }
            result.sort((a, b) => fileName(a.path).toLowerCase().compareTo(fileName(b.path).toLowerCase()));
            if (!mounted) return;
            setState(() { _songs..clear()..addAll(result); });
            _filter(_search.text);
          }

          bool _isAudio(String path) {
            final p = path.toLowerCase();
            const exts = ['.mp3', '.m4a', '.aac', '.wav', '.ogg', '.flac', '.wma', '.opus'];
            return exts.any(p.endsWith);
          }

          String fileName(String path) {
            final name = path.split('/').last;
            return name.replaceFirst(RegExp(r'\.[^.]+$'), '').replaceAll(RegExp(r'\([^)]*\)'), '').replaceAll(RegExp(r'\[[^]]*\]'), '').replaceAll('_', ' ').replaceAll('-', ' ').trim();
          }

          List<File> _baseList() {
            switch (_view) {
              case 'Favorites': return _songs.where((f) => _favorites.contains(f.path)).toList();
              case 'Recent': return _recent.map(File.new).where((f) => f.existsSync()).toList();
              case 'PlaylistDetail':
                final p = _playlists.firstWhere((e) => e['name'] == _playlistDetail, orElse: () => {'name': '', 'songs': <String>[]});
                final paths = p['songs'] as List<String>;
                return _songs.where((f) => paths.contains(f.path)).toList();
              default: return List<File>.from(_songs);
            }
          }

          void _filter(String query) {
            final base = _baseList();
            final q = query.trim().toLowerCase();
            setState(() {
              _visibleSongs = q.isEmpty ? base : base.where((f) => fileName(f.path).toLowerCase().contains(q)).toList();
            });
          }

          Future<void> _play(File file) async {
            final index = _visibleSongs.indexWhere((f) => f.path == file.path);
            if (index < 0) return;
            setState(() => _currentIndex = index);
            await _player.play(DeviceFileSource(file.path));
            _recent.remove(file.path);
            _recent.insert(0, file.path);
            if (_recent.length > 50) _recent.removeLast();
            await _save();
          }

          Future<void> _next() async {
            if (_visibleSongs.isEmpty) return;
            final next = _currentIndex + 1;
            if (next >= _visibleSongs.length) return;
            await _play(_visibleSongs[next]);
          }

          Future<void> _toggleFavorite(String path) async {
            setState(() {
              if (_favorites.contains(path)) _favorites.remove(path);
              else _favorites.add(path);
            });
            await _save();
            _filter(_search.text);
          }

          Future<void> _addFolder() async {
            await _requestStorage();
            try {
              String? path = await FilePicker.getDirectoryPath();
              if (path == null) return;
              if (_folders.any((f) => f['path'] == path)) return;
              setState(() {
                _folders.add({
                  'name': path.split('/').last,
                  'path': path,
                  'enabled': true,
                });
              });
              await _save();
              await _scan();
            } catch (_) {}
          }

          Widget _songList() {
            if (_visibleSongs.isEmpty) {
              return Center(
                child: Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    const Icon(Icons.library_music, size: 64, color: Colors.black12),
                    const SizedBox(height: 12),
                    const Text('No songs found', style: TextStyle(color: Colors.grey, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 18),
                    FilledButton.icon(
                      onPressed: _addFolder,
                      icon: const Icon(Icons.folder_open),
                      label: const Text('Add Music Folder'),
                    ),
                  ],
                ),
              );
            }
            return ListView.builder(
              itemCount: _visibleSongs.length,
              itemBuilder: (context, index) {
                final song = _visibleSongs[index];
                final current = index == _currentIndex && _playing;
                return ListTile(
                  leading: CircleAvatar(
                    backgroundColor: current ? Colors.deepPurple : Colors.grey.shade200,
                    child: Icon(Icons.music_note, color: current ? Colors.white : Colors.grey),
                  ),
                  title: Text(fileName(song.path), maxLines: 1, overflow: TextOverflow.ellipsis),
                  trailing: IconButton(
                    onPressed: () => _toggleFavorite(song.path),
                    icon: Icon(_favorites.contains(song.path) ? Icons.favorite : Icons.favorite_border),
                  ),
                  onTap: () => _play(song),
                );
              },
            );
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('Bhai Bhai Music Player'),
                actions: [
                  IconButton(
                    icon: const Icon(Icons.equalizer),
                    onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const EqualizerScreen())),
                  )
                ],
              ),
              body: _songList(),
              floatingActionButton: FloatingActionButton(
                onPressed: _addFolder,
                child: const Icon(Icons.create_new_folder),
              ),
            );
          }

          @override
          void dispose() {
            _player.dispose();
            _search.dispose();
            super.dispose();
          }
        }
        HOME_EOF

    - name: Build Debug APK
      run: |
        flutter pub get
        flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: music-player-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
