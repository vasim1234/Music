name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: 🔧 Fix Android Configuration
        run: |
          echo "📋 Original compileSdkVersion:"
          grep -n "compileSdkVersion" android/app/build.gradle || echo "Not found"
          
          echo "🔧 Fixing..."
          sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' android/app/build.gradle.kts || true
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = '\''1.9.0'\''/g' android/build.gradle
          
          echo "✅ Fixed compileSdkVersion:"
          grep -n "compileSdkVersion" android/app/build.gradle || echo "⚠️ Not found - but that's OK"
          
          echo "📋 Kotlin version:"
          grep -n "kotlin_version" android/build.gradle || echo "⚠️ Not found"
      
      - name: Clean Build Cache
        run: |
          flutter clean
          cd android && ./gradlew clean || true
          
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Build Release APK
        run: |
          echo "🚀 Building APK..."
          flutter build apk --release --verbose || {
            echo "❌ Build failed! Checking Gradle files..."
            cat android/app/build.gradle | head -30
            exit 1
          }
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
