name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Fix Pubspec & Project
      run: |
        sed -i 's/3.13.1/3.0.0/g' pubspec.yaml || true
        rm -rf android ios
        flutter create --platforms=android --project-name=music_player .
        
        # Force compileSdk version 34 to avoid build failure
        sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle.kts || true
        sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle || true

    - name: Install Dependencies
      run: |
        flutter pub add audioplayers file_picker permission_handler shared_preferences
        flutter pub get

    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: music-player-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
