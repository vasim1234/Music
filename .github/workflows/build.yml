name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Clear Flutter Cache
        run: |
          echo "🧹 Clearing Flutter cache..."
          flutter clean
          rm -rf ~/.pub-cache
          echo "✅ Cache cleared!"
      
      - name: Force Fix Package Name
        run: |
          echo "🔧 Force fixing package name in pubspec.yaml..."
          sed -i '1s/name:.*/name: music/' pubspec.yaml
          echo "✅ Package name fixed!"
      
      - name: Recreate Android Folder
        run: |
          echo "Deleting android folder..."
          rm -rf android
          
          echo "Creating fresh Android project..."
          flutter create --platforms=android .
          
          echo "✅ Android folder created!"
      
      # ✅ CRITICAL FIX: minSdkVersion 21 karo
      - name: Fix minSdkVersion to 21
        run: |
          echo "🔧 Fixing minSdkVersion to 21..."
          
          # Check current minSdkVersion
          echo "📋 Current minSdkVersion:"
          grep -n "minSdkVersion" android/app/build.gradle || echo "Not found"
          
          # Fix minSdkVersion
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion = 19/minSdkVersion = 21/g' android/app/build.gradle
          sed -i '/defaultConfig {/,/}/ s/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle
          
          echo "✅ minSdkVersion fixed to 21!"
          
          # Verify
          echo "📋 Updated minSdkVersion:"
          grep -n "minSdkVersion" android/app/build.gradle
      
      - name: Add Storage Permissions
        run: |
          echo "Adding permissions to AndroidManifest.xml..."
          
          sed -i '/<manifest /a\
          \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\
          \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\
          \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\
          \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\
          \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
