name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=music
          flutter clean
      
      - name: Fix Android SDK & Desugaring
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }" >> android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts
          fi

      - name: Install Dependencies
        run: |
          flutter pub get
      
      - name: Force file_picker to SDK 36
        run: |
          # Find file_picker build.gradle
          FILE_PICKER_GRADLE=$(find ~/.pub-cache -name "build.gradle" -path "*file_picker*" 2>/dev/null | head -1)
          
          if [ -n "$FILE_PICKER_GRADLE" ]; then
            echo "✅ Found file_picker at: $FILE_PICKER_GRADLE"
            # Force SDK to 36
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$FILE_PICKER_GRADLE"
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' "$FILE_PICKER_GRADLE"
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' "$FILE_PICKER_GRADLE"
            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' "$FILE_PICKER_GRADLE"
            echo "✅ file_picker forced to SDK 36"
          else
            echo "⚠️ file_picker not found!"
          fi
          
          # Also fix flutter_plugin_android_lifecycle
          LIFECYCLE_GRADLE=$(find ~/.pub-cache -name "build.gradle" -path "*flutter_plugin_android_lifecycle*" 2>/dev/null | head -1)
          if [ -n "$LIFECYCLE_GRADLE" ]; then
            echo "✅ Found lifecycle at: $LIFECYCLE_GRADLE"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$LIFECYCLE_GRADLE"
            echo "✅ lifecycle forced to SDK 36"
          fi
          
          # Fix any other plugins
          find ~/.pub-cache -name "build.gradle" -path "*/audioplayers_android*" 2>/dev/null | while read -r file; do
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$file"
            echo "✅ Fixed audioplayers_android"
          done

      - name: Build APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mkdir -p build/app/outputs/flutter-apk/
          cp android/app/build/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null || echo "APK not found"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
