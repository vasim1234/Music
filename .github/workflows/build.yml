name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      # ✅ FIX: Install Android SDK 35 explicitly
      - name: 📦 Install Android SDK 35
        run: |
          echo "📦 Installing Android SDK 35..."
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          # Set Android SDK path
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          export PATH=$PATH:$ANDROID_HOME/tools
          export PATH=$PATH:$ANDROID_HOME/tools/bin
          
          mkdir -p $ANDROID_HOME
          
          # Download command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          # Accept all licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          
          # Install SDK 35
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"
          
          # Set environment variable for Gradle
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          
          # Verify installation
          echo "✅ Android SDK 35 installed!"
          ls -la $ANDROID_HOME/platforms/ || echo "⚠️ Platforms directory not found"
          ls -la $ANDROID_HOME/build-tools/ || echo "⚠️ Build-tools directory not found"
      
      # ✅ Alternative: Use sdkmanager if already available
      - name: 📦 Alternative - Use existing sdkmanager
        if: failure()
        run: |
          echo "📦 Trying with existing sdkmanager..."
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          # Check if sdkmanager exists
          if command -v sdkmanager &> /dev/null; then
            echo "✅ sdkmanager found!"
            sdkmanager "platforms;android-35"
            sdkmanager "build-tools;35.0.0"
          else
            echo "⚠️ sdkmanager not found, skipping..."
          fi
      
      - name: Get Dependencies
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          flutter pub get
      
      # ✅ Force compileSdkVersion to 35 in project files
      - name: 🔧 Ensure compileSdkVersion 35 in project
        run: |
          echo "🔧 Setting compileSdkVersion to 35 in project files..."
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/g' android/app/build.gradle
          
          echo "✅ Project files updated to use SDK 35!"
          grep "compileSdkVersion" android/app/build.gradle
      
      # ✅ Fix Kotlin version
      - name: 🔧 Fix Kotlin version
        run: |
          echo "🔧 Setting Kotlin version to 1.9.0..."
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          echo "✅ Kotlin version fixed!"
      
      - name: 🔍 Verify SDK 35 Installation
        run: |
          echo "📋 Verifying Android SDK 35 installation..."
          export ANDROID_HOME=/usr/local/lib/android/sdk
          
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "✅ Android SDK 35 is installed!"
            ls -la $ANDROID_HOME/platforms/android-35/
          else
            echo "⚠️ Android SDK 35 not found in default location. Checking custom location..."
            if [ -d "$HOME/android-sdk/platforms/android-35" ]; then
              echo "✅ Android SDK 35 found in custom location!"
              ls -la $HOME/android-sdk/platforms/android-35/
            else
              echo "❌ Android SDK 35 not found! Build might fail."
            fi
          fi
      
      - name: Clean Build Cache
        run: |
          flutter clean
          rm -rf android/.gradle
      
      - name: Build Release APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          echo "🚀 Building APK..."
          flutter build apk --release
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
