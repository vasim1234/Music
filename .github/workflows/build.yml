name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Clean and Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=music
          flutter clean
      
      - name: Fix Android SDK & Add Desugaring
        run: |
          # Fix app/build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }" >> android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts
          fi
      
      - name: Force All Plugins to SDK 36
        run: |
          # Force all plugins to use SDK 36
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" 2>/dev/null | while read -r file; do
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$file" 2>/dev/null || true
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' "$file" 2>/dev/null || true
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' "$file" 2>/dev/null || true
            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' "$file" 2>/dev/null || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' "$file" 2>/dev/null || true
            sed -i 's/minSdk = [0-9]*/minSdk = 24/g' "$file" 2>/dev/null || true
          done
          
          # Also fix app/build.gradle again to be safe
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' android/app/build.gradle
          fi
          
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9]*/minSdk = 24/g' android/app/build.gradle.kts
          fi

      - name: Add Namespace
        run: |
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "namespace" android/app/build.gradle; then
              sed -i '/android {/a \    namespace "com.example.music"' android/app/build.gradle
            fi
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            if ! grep -q "namespace" android/app/build.gradle.kts; then
              sed -i '/android {/a \    namespace = "com.example.music"' android/app/build.gradle.kts
            fi
          fi

      - name: Install Dependencies
        run: |
          flutter pub get
      
      - name: Build APK
        run: flutter build apk --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Music-Player-Folder
          path: build/app/outputs/flutter-apk/app-debug.apk
