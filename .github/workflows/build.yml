name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Prepare Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=music
          flutter pub add audioplayers:^6.0.0 file_picker:^8.0.0 permission_handler:^11.3.1 shared_preferences:^2.2.2 flutter_local_notifications:^17.1.2
          flutter pub get

      - name: Add Android Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      - name: Enable Core Library Desugaring
        run: |
          cat << 'EOF' >> android/app/build.gradle
          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          EOF

      - name: Build New Version APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pbuild-number=${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
