name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      # ✅ STEP 1: Get dependencies (packages download honge)
      - name: Get Dependencies
        run: flutter pub get
      
      # ✅ STEP 2: 🔧 FIX ALL PACKAGES - JAD SE SOLUTION!
      - name: 🔧 Fix compileSdkVersion in ALL packages
        run: |
          echo "📋 Finding all build.gradle files in pub packages..."
          
          # Find all build.gradle files in pub cache
          find ~/.pub-cache -name "build.gradle" -type f | while read file; do
            # Check if file contains compileSdkVersion 35
            if grep -q "compileSdkVersion 35" "$file"; then
              echo "🔧 Fixing: $file"
              sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' "$file"
              sed -i 's/compileSdkVersion = 35/compileSdkVersion = 34/g' "$file"
              sed -i 's/compileSdkVersion: 35/compileSdkVersion: 34/g' "$file"
            fi
          done
          
          # Fix Kotlin version in all packages
          find ~/.pub-cache -name "build.gradle" -type f | while read file; do
            if grep -q "ext.kotlin_version = '1.7.1'" "$file"; then
              echo "🔧 Fixing Kotlin version in: $file"
              sed -i "s/ext.kotlin_version = '1.7.1'/ext.kotlin_version = '1.9.0'/g" "$file"
            fi
            if grep -q "kotlin_version = '1.7.1'" "$file"; then
              echo "🔧 Fixing Kotlin version in: $file"
              sed -i "s/kotlin_version = '1.7.1'/kotlin_version = '1.9.0'/g" "$file"
            fi
          done
          
          echo "✅ ALL PACKAGES FIXED!"
      
      # ✅ STEP 3: Fix project files too
      - name: 🔧 Fix Project Android Files
        run: |
          echo "🔧 Fixing project build.gradle files..."
          
          # Fix root build.gradle
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          # Fix app/build.gradle
          cat > android/app/build.gradle << 'EOF'
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
          }
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }
          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
          android {
              compileSdkVersion 34
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }
              defaultConfig {
                  applicationId 'com.yourcompany.yourapp'
                  minSdkVersion 26
                  targetSdkVersion 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          flutter {
              source '../..'
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
          }
          EOF
          
          echo "✅ Project files fixed!"
      
      # ✅ STEP 4: Verify fixes
      - name: 🔍 Verify All Fixes
        run: |
          echo "📋 Checking pub cache for remaining compileSdkVersion 35..."
          find ~/.pub-cache -name "build.gradle" -type f -exec grep -l "compileSdkVersion 35" {} \;
          if [ $? -eq 0 ]; then
            echo "⚠️ Some files still have compileSdkVersion 35. Fixing again..."
            find ~/.pub-cache -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' {} \;
          else
            echo "✅ No more compileSdkVersion 35 found!"
          fi
          
          echo ""
          echo "📋 Checking project Kotlin version:"
          grep "kotlin_version" android/build.gradle
      
      - name: Clean Build Cache
        run: |
          flutter clean
          rm -rf android/.gradle
      
      - name: Build Release APK
        run: |
          echo "🚀 Building APK..."
          flutter build apk --release
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
