name: Build Music Player APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Android SDK to 34
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion 36/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/targetSdkVersion 36/targetSdkVersion 34/g' android/app/build.gradle
            sed -i 's/minSdkVersion 24/minSdkVersion 21/g' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = 36/compileSdk = 34/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = 36/targetSdk = 34/g' android/app.build.gradle.kts
            sed -i 's/minSdk = 24/minSdk = 21/g' android/app.build.gradle.kts
          fi

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bhai-Bhai-Music-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
