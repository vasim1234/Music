name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Clean and Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=music
          flutter clean
      
      - name: Fix Android SDK
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle.kts
          else
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Add Namespace
        run: |
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "namespace" android/app/build.gradle; then
              sed -i '/android {/a \    namespace "com.example.music"' android/app/build.gradle
            fi
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            if ! grep -q "namespace" android/app/build.gradle.kts; then
              sed -i '/android {/a \    namespace = "com.example.music"' android/app/build.gradle.kts
            fi
          fi

      - name: Install Dependencies
        run: |
          flutter pub get
      
      - name: Build APK
        run: flutter build apk --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Music-Player-Folder
          path: build/app/outputs/flutter-apk/app-debug.apk
