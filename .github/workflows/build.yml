name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=music
          flutter clean
      
      - name: Install Dependencies
        run: |
          flutter pub get
      
      - name: Build APK
        run: flutter build apk --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
