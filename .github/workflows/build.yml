name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Recreate Android Folder
        run: |
          echo "Deleting android folder..."
          rm -rf android
          
          echo "Creating fresh Android project..."
          flutter create --platforms=android .
          
          echo "✅ Android folder created!"
      
      - name: Add Storage Permissions
        run: |
          echo "Adding permissions to AndroidManifest.xml..."
          sed -i '/<manifest /a\
          \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\
          \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\
          \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\
          \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\
          \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
