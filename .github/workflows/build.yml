name: Build Music Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Re-generate Android Project
        run: |
          rm -rf android
          rm -f pubspec.lock
          flutter create . --platforms=android --project-name=music
          flutter clean

      - name: Fix Android SDK & Enable Desugaring
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 37/' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 37/' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle.kts
            
            cat << 'GRADLE_EOF' >> android/app/build.gradle.kts
          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          GRADLE_EOF
          else
            sed -i 's/compileSdkVersion .*/compileSdkVersion 37/' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 37/' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4' }" >> android/app/build.gradle
          fi

      - name: Add Dependencies
        run: |
          flutter pub add audioplayers permission_handler shared_preferences flutter_local_notifications on_audio_query
          flutter pub get

      - name: Create Splash Screen
        run: |
          mkdir -p lib/screens
          cat > lib/screens/splash_screen.dart << 'SPLASH_EOF'
          import 'package:flutter/material.dart';
          import 'home_screen.dart';

          class SplashScreen extends StatefulWidget {
            const SplashScreen({Key? key}) : super(key: key);

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> {
            @override
            void initState() {
              super.initState();
              Future.delayed(const Duration(seconds: 2), () {
                if (mounted) {
                  Navigator.of(context).pushReplacement(
                    MaterialPageRoute(builder: (_) => const HomeScreen()),
                  );
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      colors: [Color(0xFF0F172A), Color(0xFF1E1B4B)],
                      begin: Alignment.topCenter,
                      end: Alignment.bottomCenter,
                    ),
                  ),
                  child: const Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(Icons.headphones, size: 80, color: Colors.white),
                        SizedBox(height: 20),
                        Text(
                          'Music Player',
                          style: TextStyle(
                            color: Colors.white,
                            fontSize: 28,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          SPLASH_EOF

      - name: Create Home Screen
        run: |
          cat > lib/screens/home_screen.dart << 'HOME_EOF'
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:audioplayers/audioplayers.dart';
          import 'package:on_audio_query/on_audio_query.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({Key? key}) : super(key: key);
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final AudioPlayer _player = AudioPlayer();
            final OnAudioQuery _audioQuery = OnAudioQuery();
            final TextEditingController _search = TextEditingController();
            
            List<SongModel> _songs = [];
            List<SongModel> _visibleSongs = [];
            List<String> _favorites = [];
            List<String> _recent = [];
            List<Map<String, dynamic>> _playlists = [];
            String _view = 'Songs';
            String? _playlistDetail;
            int _currentIndex = -1;
            bool _playing = false;
            bool _loading = true;
            Duration _duration = Duration.zero;
            Duration _position = Duration.zero;
            StreamSubscription? _stateSub, _durationSub, _positionSub, _completeSub;

            @override
            void initState() {
              super.initState();
              _stateSub = _player.onPlayerStateChanged.listen((s) {
                if (!mounted) return;
                setState(() => _playing = s == PlayerState.playing);
              });
              _durationSub = _player.onDurationChanged.listen((d) {
                if (mounted) setState(() => _duration = d);
              });
              _positionSub = _player.onPositionChanged.listen((p) {
                if (mounted) setState(() => _position = p);
              });
              _completeSub = _player.onPlayerComplete.listen((_) => _next());
              _initApp();
            }

            Future<void> _initApp() async {
              await _loadSavedData();
              await _requestAndScan();
            }

            Future<void> _loadSavedData() async {
              final p = await SharedPreferences.getInstance();
              _favorites = p.getStringList('favorites') ?? [];
              _recent = p.getStringList('recent') ?? [];
              final playlistStrings = p.getStringList('playlists') ?? [];
              _playlists = [];
              for (final item in playlistStrings) {
                final parts = item.split('|||');
                if (parts.isEmpty) continue;
                _playlists.add({
                  'name': parts.first,
                  'songs': parts.length > 1 ? parts[1].split('|').where((e) => e.isNotEmpty).toList() : <String>[],
                });
              }
            }

            Future<void> _saveData() async {
              final p = await SharedPreferences.getInstance();
              await p.setStringList('favorites', _favorites);
              await p.setStringList('recent', _recent);
              await p.setStringList('playlists', _playlists.map((e) => '${e['name']}|||${(e['songs'] as List<String>).join('|')}').toList());
            }

            Future<void> _requestAndScan() async {
              setState(() => _loading = true);
              if (Platform.isAndroid) {
                await Permission.storage.request();
                await Permission.audio.request();
                await Permission.manageExternalStorage.request();
              }
              await _scanDeviceSongs();
            }

            Future<void> _scanDeviceSongs() async {
              try {
                bool hasPermission = await _audioQuery.permissionsStatus();
                if (!hasPermission) {
                  hasPermission = await _audioQuery.permissionsRequest();
                }

                List<SongModel> queriedSongs = await _audioQuery.querySongs(
                  sortType: SongSortType.TITLE,
                  orderType: OrderType.ASC_OR_SMALLER,
                  uriType: UriType.EXTERNAL,
                  ignoreCase: true,
                );

                queriedSongs = queriedSongs.where((s) => (s.duration ?? 0) > 10000).toList();

                if (mounted) {
                  setState(() {
                    _songs = queriedSongs;
                    _loading = false;
                  });
                  _filter(_search.text);
                }
              } catch (e) {
                if (mounted) setState(() => _loading = false);
              }
            }

            List<SongModel> _baseList() {
              switch (_view) {
                case 'Favorites':
                  return _songs.where((s) => _favorites.contains(s.data)).toList();
                case 'Recent':
                  return _recent.map((path) => _songs.firstWhere((s) => s.data == path, orElse: () => SongModel({'_id': -1, '_data': path, 'title': path.split('/').last}))).where((s) => s.id != -1).toList();
                case 'PlaylistDetail':
                  final p = _playlists.firstWhere((e) => e['name'] == _playlistDetail, orElse: () => {'name': '', 'songs': <String>[]});
                  final paths = p['songs'] as List<String>;
                  return _songs.where((s) => paths.contains(s.data)).toList();
                default:
                  return List<SongModel>.from(_songs);
              }
            }

            void _filter(String query) {
              final base = _baseList();
              final q = query.trim().toLowerCase();
              setState(() {
                _visibleSongs = q.isEmpty ? base : base.where((s) => s.title.toLowerCase().contains(q) || s.artist.toString().toLowerCase().contains(q)).toList();
              });
            }

            Future<void> _play(SongModel song) async {
              final index = _visibleSongs.indexWhere((s) => s.id == song.id);
              if (index < 0) return;
              setState(() => _currentIndex = index);
              await _player.play(DeviceFileSource(song.data));
              _recent.remove(song.data);
              _recent.insert(0, song.data);
              if (_recent.length > 50) _recent.removeLast();
              await _saveData();
            }

            Future<void> _next() async {
              if (_visibleSongs.isEmpty) return;
              final next = _currentIndex + 1;
              if (next >= _visibleSongs.length) return;
              await _play(_visibleSongs[next]);
            }

            Future<void> _previous() async {
              if (_visibleSongs.isEmpty) return;
              final prev = _currentIndex - 1;
              if (prev < 0) return;
              await _play(_visibleSongs[prev]);
            }

            void _setView(String view) {
              setState(() {
                _view = view;
                if (view != 'PlaylistDetail') _playlistDetail = null;
                _search.clear();
              });
              _filter('');
            }

            Future<void> _toggleFavorite(String path) async {
              setState(() {
                if (_favorites.contains(path)) _favorites.remove(path);
                else _favorites.add(path);
              });
              await _saveData();
              _filter(_search.text);
            }

            Future<void> _createPlaylist() async {
              final controller = TextEditingController();
              final name = await showDialog<String>(
                context: context,
                builder: (context) => AlertDialog(
                  title: const Text('Create Playlist'),
                  content: TextField(
                    controller: controller,
                    autofocus: true,
                    decoration: const InputDecoration(hintText: 'Playlist name'),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),
                    FilledButton(onPressed: () => Navigator.pop(context, controller.text.trim()), child: const Text('Create')),
                  ],
                ),
              );
              controller.dispose();
              if (name == null || name.isEmpty) return;
              setState(() {
                _playlists.add({'name': name, 'songs': <String>[]});
              });
              await _saveData();
              _setView('Playlists');
            }

            Future<void> _addToPlaylist(SongModel song) async {
              if (_playlists.isEmpty) {
                await _createPlaylist();
                if (_playlists.isEmpty) return;
              }
              final selected = await showDialog<int>(
                context: context,
                builder: (context) => SimpleDialog(
                  title: const Text('Add to Playlist'),
                  children: List.generate(_playlists.length, (i) => SimpleDialogOption(
                    onPressed: () => Navigator.pop(context, i),
                    child: Text(_playlists[i]['name'] as String),
                  )),
                ),
              );
              if (selected == null) return;
              final songs = _playlists[selected]['songs'] as List<String>;
              if (!songs.contains(song.data)) songs.add(song.data);
              await _saveData();
              if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Added to playlist.')));
            }

            String _time(Duration d) {
              final m = d.inMinutes.remainder(60).toString().padLeft(2, '0');
              final s = d.inSeconds.remainder(60).toString().padLeft(2, '0');
              return '$m:$s';
            }

            void _openPlayer() {
              if (_currentIndex < 0 || _currentIndex >= _visibleSongs.length) return;
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: Colors.transparent,
                builder: (_) => StatefulBuilder(
                  builder: (context, setModal) {
                    final song = _visibleSongs[_currentIndex];
                    return Container(
                      height: MediaQuery.sizeOf(context).height * .94,
                      decoration: const BoxDecoration(
                        gradient: LinearGradient(
                          colors: [Color(0xFF0F172A), Color(0xFF1E1B4B)],
                          begin: Alignment.topCenter,
                          end: Alignment.bottomCenter,
                        ),
                        borderRadius: BorderRadius.vertical(top: Radius.circular(28)),
                      ),
                      child: Column(
                        children: [
                          const SizedBox(height: 12),
                          Container(
                            width: 45,
                            height: 5,
                            decoration: BoxDecoration(
                              color: Colors.white24,
                              borderRadius: BorderRadius.circular(10),
                            ),
                          ),
                          Padding(
                            padding: const EdgeInsets.all(18),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                IconButton(
                                  onPressed: () => Navigator.pop(context),
                                  icon: const Icon(Icons.keyboard_arrow_down, color: Colors.white, size: 32),
                                ),
                                const Text('Now Playing', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 18)),
                                const SizedBox(width: 48),
                              ],
                            ),
                          ),
                          Container(
                            width: 260,
                            height: 260,
                            decoration: const BoxDecoration(
                              shape: BoxShape.circle,
                              gradient: LinearGradient(
                                colors: [Color(0xFF4C83FF), Color(0xFFD946EF)],
                              ),
                            ),
                            child: QueryArtworkWidget(
                              id: song.id,
                              type: ArtworkType.AUDIO,
                              artworkBorder: BorderRadius.circular(130),
                              nullArtworkWidget: const Icon(Icons.music_note, size: 120, color: Colors.white),
                            ),
                          ),
                          const SizedBox(height: 25),
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 25),
                            child: Text(
                              song.title,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(color: Colors.white, fontSize: 22, fontWeight: FontWeight.bold),
                            ),
                          ),
                          Text(song.artist ?? '<Unknown Artist>', style: const TextStyle(color: Colors.white54)),
                          const Spacer(),
                          Slider(
                            value: _position.inMilliseconds.clamp(0, _duration.inMilliseconds).toDouble(),
                            min: 0,
                            max: (_duration.inMilliseconds > 0 ? _duration.inMilliseconds : 1).toDouble(),
                            onChanged: (v) async {
                              await _player.seek(Duration(milliseconds: v.round()));
                              setModal(() {});
                            },
                          ),
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 25),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                Text(_time(_position), style: const TextStyle(color: Colors.white54)),
                                Text(_time(_duration), style: const TextStyle(color: Colors.white54)),
                              ],
                            ),
                          ),
                          const Spacer(),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: [
                              IconButton(
                                iconSize: 30,
                                onPressed: () async {
                                  await _toggleFavorite(song.data);
                                  setModal(() {});
                                },
                                icon: Icon(
                                  _favorites.contains(song.data) ? Icons.favorite : Icons.favorite_border,
                                  color: Colors.white,
                                ),
                              ),
                              IconButton(
                                iconSize: 48,
                                onPressed: () async {
                                  await _previous();
                                  setModal(() {});
                                },
                                icon: const Icon(Icons.skip_previous, color: Colors.white),
                              ),
                              Container(
                                width: 72,
                                height: 72,
                                decoration: const BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: Colors.purpleAccent,
                                ),
                                child: IconButton(
                                  iconSize: 42,
                                  onPressed: () async {
                                    if (_playing) {
                                      await _player.pause();
                                    } else {
                                      await _player.resume();
                                    }
                                    setModal(() {});
                                  },
                                  icon: Icon(_playing ? Icons.pause : Icons.play_arrow, color: Colors.white),
                                ),
                              ),
                              IconButton(
                                iconSize: 48,
                                onPressed: () async {
                                  await _next();
                                  setModal(() {});
                                },
                                icon: const Icon(Icons.skip_next, color: Colors.white),
                              ),
                              IconButton(
                                iconSize: 28,
                                onPressed: () => _addToPlaylist(song),
                                icon: const Icon(Icons.playlist_add, color: Colors.white70),
                              ),
                            ],
                          ),
                          const SizedBox(height: 45),
                        ],
                      ),
                    );
                  },
                ),
              );
            }

            Widget _songList() {
              if (_loading) {
                return const Center(child: CircularProgressIndicator());
              }
              if (_visibleSongs.isEmpty) {
                return Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(Icons.library_music, size: 64, color: Colors.black12),
                      const SizedBox(height: 12),
                      Text(
                        _view == 'Favorites' ? 'No favorites yet' : _view == 'Recent' ? 'No recent songs' : 'No songs found',
                        style: const TextStyle(color: Colors.grey, fontWeight: FontWeight.bold),
                      ),
                      const SizedBox(height: 18),
                      FilledButton.icon(
                        onPressed: _requestAndScan,
                        icon: const Icon(Icons.refresh),
                        label: const Text('Scan Device Music'),
                      ),
                    ],
                  ),
                );
              }
              return RefreshIndicator(
                onRefresh: _requestAndScan,
                child: ListView.builder(
                  itemCount: _visibleSongs.length,
                  itemBuilder: (context, index) {
                    final song = _visibleSongs[index];
                    final current = index == _currentIndex && _playing;
                    return ListTile(
                      leading: QueryArtworkWidget(
                        id: song.id,
                        type: ArtworkType.AUDIO,
                        nullArtworkWidget: CircleAvatar(
                          backgroundColor: current ? Colors.deepPurple : Colors.grey.shade200,
                          child: Icon(Icons.music_note, color: current ? Colors.white : Colors.grey),
                        ),
                      ),
                      title: Text(
                        song.title,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: TextStyle(
                          fontWeight: current ? FontWeight.bold : FontWeight.w500,
                          color: current ? Colors.deepPurple : Colors.black87,
                        ),
                      ),
                      subtitle: Text(
                        song.artist ?? '<Unknown>',
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                      ),
                      trailing: Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          IconButton(
                            onPressed: () => _toggleFavorite(song.data),
                            icon: Icon(
                              _favorites.contains(song.data) ? Icons.favorite : Icons.favorite_border,
                              color: _favorites.contains(song.data) ? Colors.deepPurpleAccent : Colors.grey,
                            ),
                          ),
                          IconButton(
                            onPressed: () => _addToPlaylist(song),
                            icon: const Icon(Icons.playlist_add, color: Colors.grey),
                          ),
                        ],
                      ),
                      onTap: () => _play(song),
                    );
                  },
                ),
              );
            }

            Widget _playlistsView() {
              if (_playlists.isEmpty) {
                return Center(
                  child: FilledButton.icon(
                    onPressed: _createPlaylist,
                    icon: const Icon(Icons.add),
                    label: const Text('Create Playlist'),
                  ),
                );
              }
              return ListView.builder(
                itemCount: _playlists.length,
                itemBuilder: (context, i) {
                  final p = _playlists[i];
                  final songs = p['songs'] as List<String>;
                  return Card(
                    margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 5),
                    child: ListTile(
                      leading: const CircleAvatar(child: Icon(Icons.queue_music)),
                      title: Text(p['name'] as String, style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text('${songs.length} songs'),
                      trailing: IconButton(
                        icon: const Icon(Icons.delete_outline, color: Colors.red),
                        onPressed: () async {
                          setState(() => _playlists.removeAt(i));
                          await _saveData();
                        },
                      ),
                      onTap: () {
                        setState(() {
                          _playlistDetail = p['name'] as String;
                          _view = 'PlaylistDetail';
                        });
                        _filter('');
                      },
                    ),
                  );
                },
              );
            }

            Widget _body() {
              if (_view == 'Playlists') return _playlistsView();
              if (_view == 'PlaylistDetail') {
                return Column(
                  children: [
                    ListTile(
                      leading: const BackButton(),
                      title: Text(_playlistDetail ?? 'Playlist'),
                      onTap: () => _setView('Playlists'),
                    ),
                    Expanded(child: _songList()),
                  ],
                );
              }
              return _songList();
            }

            Widget _tab(String name) {
              final selected = _view == name;
              return Expanded(
                child: GestureDetector(
                  onTap: () => _setView(name),
                  child: Container(
                    margin: const EdgeInsets.symmetric(horizontal: 3),
                    padding: const EdgeInsets.symmetric(vertical: 9),
                    decoration: BoxDecoration(
                      color: selected ? Colors.black : Colors.grey.shade100,
                      borderRadius: BorderRadius.circular(20),
                    ),
                    child: Text(
                      name,
                      textAlign: TextAlign.center,
                      style: TextStyle(
                        color: selected ? Colors.white : Colors.grey.shade700,
                        fontSize: 12,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                  ),
                ),
              );
            }

            Widget _miniPlayer() {
              final song = _visibleSongs[_currentIndex];
              return Material(
                color: Colors.transparent,
                child: InkWell(
                  onTap: _openPlayer,
                  child: Container(
                    margin: const EdgeInsets.all(8),
                    padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                    decoration: BoxDecoration(
                      gradient: const LinearGradient(
                        colors: [Color(0xFFFFE4F1), Color(0xFFE9D5FF)],
                      ),
                      borderRadius: BorderRadius.circular(22),
                    ),
                    child: Row(
                      children: [
                        QueryArtworkWidget(
                          id: song.id,
                          type: ArtworkType.AUDIO,
                          nullArtworkWidget: const CircleAvatar(
                            backgroundColor: Colors.black87,
                            child: Icon(Icons.music_note, color: Colors.white),
                          ),
                        ),
                        const SizedBox(width: 10),
                        Expanded(
                          child: Text(song.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                        ),
                        IconButton(
                          onPressed: () => _playing ? _player.pause() : _player.resume(),
                          icon: Icon(_playing ? Icons.pause : Icons.play_arrow),
                        ),
                        IconButton(
                          onPressed: _next,
                          icon: const Icon(Icons.skip_next),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: TextField(
                    controller: _search,
                    onChanged: _filter,
                    decoration: const InputDecoration(
                      hintText: 'Search songs...',
                      border: InputBorder.none,
                      prefixIcon: Icon(Icons.search),
                    ),
                  ),
                ),
                drawer: Drawer(
                  child: SafeArea(
                    child: Column(
                      children: [
                        Container(
                          width: double.infinity,
                          padding: const EdgeInsets.all(22),
                          decoration: const BoxDecoration(
                            gradient: LinearGradient(
                              colors: [Color(0xFF1E1B4B), Color(0xFFD946EF)],
                            ),
                          ),
                          child: const Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Icon(Icons.headphones, color: Colors.white, size: 45),
                              SizedBox(height: 12),
                              Text('Bhai Bhai App', style: TextStyle(color: Colors.white, fontSize: 24, fontWeight: FontWeight.bold)),
                              Text('Local Audio Player', style: TextStyle(color: Colors.white70)),
                            ],
                          ),
                        ),
                        ListTile(
                          leading: const Icon(Icons.refresh, color: Colors.blueAccent),
                          title: const Text('Scan Music', style: TextStyle(fontWeight: FontWeight.w600)),
                          onTap: () {
                            Navigator.pop(context);
                            _requestAndScan();
                          },
                        ),
                        const Divider(),
                        ListTile(
                          leading: const Icon(Icons.lyrics, color: Colors.pink),
                          title: const Text('Lyrics', style: TextStyle(fontWeight: FontWeight.w600)),
                          onTap: () {
                            Navigator.pop(context);
                            ScaffoldMessenger.of(context).showSnackBar(
                              const SnackBar(content: Text('Lyrics feature coming soon! 🎵')),
                            );
                          },
                        ),
                        ListTile(
                          leading: const Icon(Icons.equalizer, color: Colors.orange),
                          title: const Text('Visualizer', style: TextStyle(fontWeight: FontWeight.w600)),
                          onTap: () {
                            Navigator.pop(context);
                            ScaffoldMessenger.of(context).showSnackBar(
                              const SnackBar(content: Text('Visualizer feature coming soon! 📊')),
                            );
                          },
                        ),
                      ],
                    ),
                  ),
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.fromLTRB(12, 8, 12, 4),
                      child: Row(
                        children: [
                          _tab('Songs'),
                          _tab('Favorites'),
                          _tab('Recent'),
                          _tab('Playlists'),
                        ],
                      ),
                    ),
                    Expanded(child: _body()),
                    if (_currentIndex >= 0 && _visibleSongs.isNotEmpty) _miniPlayer(),
                  ],
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: 0,
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.headphones), label: 'My Music'),
                    NavigationDestination(icon: Icon(Icons.play_circle_outline), label: 'Watch'),
                  ],
                ),
              );
            }

            @override
            void dispose() {
              _stateSub?.cancel();
              _durationSub?.cancel();
              _positionSub?.cancel();
              _completeSub?.cancel();
              _player.dispose();
              _search.dispose();
              super.dispose();
            }
          }
          HOME_EOF

      - name: Build APK
        run: flutter build apk --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Music-Player-Folder
          path: build/app/outputs/flutter-apk/app-debug.apk
