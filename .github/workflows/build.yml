name: Build Music Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: 1. Deep Clean Project
        run: |
          rm -rf android
          rm -f pubspec.lock
          flutter create . --platforms=android --project-name=music
          flutter clean
      
      - name: 2. Add Stable Packages
        run: |
          flutter pub add audioplayers:^6.0.0
          flutter pub add file_picker:^8.0.0
          flutter pub add permission_handler:^11.3.1
          flutter pub add shared_preferences:^2.2.2 
          flutter pub add flutter_local_notifications:^17.1.2
          flutter pub get
      
      - name: 3. The Stable Brahmaastra (Fix JVM)
        run: |
          cat > android/build.gradle << 'GRADLE_EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          defaultConfig {
                              minSdkVersion 24
                              targetSdkVersion 36
                          }
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
                  project.tasks.configureEach { task ->
                      if (task.name.startsWith("compile") && task.name.endsWith("Kotlin")) {
                          task.kotlinOptions {
                              jvmTarget = "17"
                          }
                      }
                  }
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          GRADLE_EOF

      - name: 4. Inject Permissions & Fix Desugaring Error (Smart Detect)
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion 21/minSdkVersion 24/g' android/app/build.gradle
            sed -i '/compileOptions {/a \ coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }" >> android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
            sed -i '/compileOptions {/a \ isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts || true
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts
          fi

          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\
          <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\
          <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
          <uses-permission android:name="android.permission.WAKE_LOCK" />\
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
          ' android/app/src/main/AndroidManifest.xml

      - name: 5. Create Services and Screens
        run: |
          mkdir -p lib/services
          
          # Sleep Timer Service
          cat > lib/services/sleep_timer_service.dart << 'SLEEP_EOF'
          import 'dart:async';

          class SleepTimerService {
            static Timer? _timer;
            static int _remainingSeconds = 0;
            static int _totalSeconds = 0;
            static bool _isRunning = false;
            static Function? _onComplete;

            static void initialize(Function onComplete) {
              _onComplete = onComplete;
            }

            static void start(int seconds, {Function? onTick}) {
              stop();
              
              _totalSeconds = seconds;
              _remainingSeconds = seconds;
              _isRunning = true;

              _timer = Timer.periodic(const Duration(seconds: 1), (timer) {
                _remainingSeconds--;
                
                if (_remainingSeconds <= 0) {
                  stop();
                  _onComplete?.call();
                }
                onTick?.call();
              });
            }

            static void stop() {
              _timer?.cancel();
              _timer = null;
              _isRunning = false;
              _remainingSeconds = 0;
            }

            static void pause() {
              _timer?.cancel();
              _timer = null;
              _isRunning = false;
            }

            static void resume() {
              if (_remainingSeconds > 0 && !_isRunning) {
                _isRunning = true;
                _timer = Timer.periodic(const Duration(seconds: 1), (timer) {
                  _remainingSeconds--;
                  if (_remainingSeconds <= 0) {
                    stop();
                    _onComplete?.call();
                  }
                });
              }
            }

            static void extend(int seconds) {
              if (_isRunning || _remainingSeconds > 0) {
                _remainingSeconds += seconds;
                _totalSeconds += seconds;
              }
            }

            static int get remainingSeconds => _remainingSeconds;
            static bool get isRunning => _isRunning;
            static double get progress => _totalSeconds > 0 
                ? (_totalSeconds - _remainingSeconds) / _totalSeconds 
                : 0.0;

            static String get formattedTime {
              final int minutes = _remainingSeconds ~/ 60;
              final int seconds = _remainingSeconds % 60;
              if (minutes > 0) {
                return '$minutes:${seconds.toString().padLeft(2, '0')}';
              }
              return '${seconds}s';
            }
          }
          SLEEP_EOF
          
          # Album Art Service
          cat > lib/services/album_art_service.dart << 'ALBUM_EOF'
          import 'package:flutter/material.dart';

          class AlbumArtService {
            static final Map<String, Color> _colorCache = {};

            static Color getColorFromName(String name) {
              if (_colorCache.containsKey(name)) {
                return _colorCache[name]!;
              }

              int hash = name.hashCode.abs();
              int hue = hash % 360;
              Color color = HSLColor.fromAHSL(1.0, hue.toDouble(), 0.7, 0.5).toColor();
              _colorCache[name] = color;
              return color;
            }

            static Widget buildAlbumArt({
              required String filePath,
              required String songName,
              double size = 50,
              BorderRadius? borderRadius,
            }) {
              final color = getColorFromName(songName);
              return Container(
                width: size,
                height: size,
                decoration: BoxDecoration(
                  gradient: LinearGradient(
                    colors: [color, color.withOpacity(0.6)],
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                  ),
                  borderRadius: borderRadius ?? BorderRadius.circular(10),
                ),
                child: Center(
                  child: Text(
                    songName.isNotEmpty ? songName[0].toUpperCase() : '🎵',
                    style: TextStyle(
                      color: Colors.white,
                      fontSize: size * 0.4,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
              );
            }
          }
          ALBUM_EOF
          
          # Notification Service
          cat > lib/services/notification_service.dart << 'NOTIFY_EOF'
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';

          class NotificationService {
            static final FlutterLocalNotificationsPlugin _notifications = FlutterLocalNotificationsPlugin();

            static Future<void> initialize() async {
              const AndroidInitializationSettings androidSettings = AndroidInitializationSettings('@mipmap/ic_launcher');
              const InitializationSettings settings = InitializationSettings(android: androidSettings);
              await _notifications.initialize(settings);
            }

            static Future<void> showNowPlayingNotification({
              required String title,
              required String artist,
              required bool isPlaying,
            }) async {
              const AndroidNotificationDetails androidDetails = AndroidNotificationDetails(
                'music_player_channel',
                'Music Player',
                channelDescription: 'Now playing music controls',
                importance: Importance.low,
                priority: Priority.high,
                ongoing: true,
                icon: '@mipmap/ic_launcher',
              );

              const NotificationDetails details = NotificationDetails(android: androidDetails);

              await _notifications.show(
                0,
                isPlaying ? '▶️ Playing: $title' : '⏸️ Paused: $title',
                artist,
                details,
              );
            }

            static Future<void> cancelNotification() async {
              await _notifications.cancel(0);
            }
          }
          NOTIFY_EOF
          
          mkdir -p lib/screens
          
          # Splash Screen
          cat > lib/screens/splash_screen.dart << 'SPLASH_EOF'
          import 'package:flutter/material.dart';
          import 'dart:async';
          import 'home_screen.dart';

          class SplashScreen extends StatefulWidget {
            const SplashScreen({Key? key}) : super(key: key);

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> with SingleTickerProviderStateMixin {
            late AnimationController _controller;
            late Animation<double> _animation;

            @override
            void initState() {
              super.initState();
              _controller = AnimationController(vsync: this, duration: const Duration(seconds: 1))..repeat(reverse: true);
              _animation = Tween<double>(begin: 0.9, end: 1.1).animate(CurvedAnimation(parent: _controller, curve: Curves.easeInOut));

              Timer(const Duration(milliseconds: 2500), () {
                Navigator.of(context).pushReplacement(MaterialPageRoute(builder: (_) => HomeScreen()));
              });
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  width: double.infinity,
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      colors: [Color(0xFF0F172A), Color(0xFFD946EF)], 
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                    ),
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      ScaleTransition(
                        scale: _animation,
                        child: Container(
                          padding: const EdgeInsets.all(30),
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            color: Colors.white.withOpacity(0.1),
                            boxShadow: [BoxShadow(color: Colors.purple.withOpacity(0.5), blurRadius: 40, spreadRadius: 10)],
                          ),
                          child: const Icon(Icons.music_note, size: 100, color: Colors.white),
                        ),
                      ),
                      const SizedBox(height: 40),
                      const Text(
                        "BHAI BHAI APP",
                        style: TextStyle(color: Colors.white, fontSize: 32, fontWeight: FontWeight.bold, letterSpacing: 3),
                      ),
                      const SizedBox(height: 10),
                      const Text("Feel The Rhythm", style: TextStyle(color: Colors.white70, fontSize: 16, letterSpacing: 1)),
                    ],
                  ),
                ),
              );
            }
          }
          SPLASH_EOF

      - name: 6. Inject Main and Home Screen Code
        run: |
          cat > lib/main.dart << 'MAIN_EOF'
          import 'package:flutter/material.dart';
          import 'screens/splash_screen.dart'; 
          import 'services/notification_service.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await NotificationService.initialize();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Bhai Bhai App',
                theme: ThemeData(primarySwatch: Colors.deepPurple, useMaterial3: true),
                home: const SplashScreen(), 
                debugShowCheckedModeBanner: false,
              );
            }
          }
          MAIN_EOF

          cat > lib/screens/home_screen.dart << 'HOME_EOF'
          // YAHAN PURA NAYA home_screen.dart DAALO
          // (Jo maine upar diya hai - with Sleep Timer & Dark Mode)
          HOME_EOF

      - name: 7. Build APK
        run: flutter build apk --debug
      
      - name: 8. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Music-Player-Folder
          path: build/app/outputs/flutter-apk/app-debug.apk
